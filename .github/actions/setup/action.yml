# The toolchain every job starts from, at the versions a laptop uses: Node from .node-version, pnpm from package.json
# "packageManager". The pnpm store is cached by lockfile.
name: Setup
description: Node, pnpm and dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
