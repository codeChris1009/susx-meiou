<!doctype html>
<!-- zh-Hant-TW, not en: the browser picks glyphs for shared Han code points by `lang`, so this keeps them Traditional -->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f6f4ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12110f"
      media="(prefers-color-scheme: dark)"
    />
    <title>susx.meiou — 作品集</title>
    <meta
      name="description"
      content="susx 的線上作品：每一個都能直接打開來玩，部署在 Cloudflare Workers 與 GitHub Pages"
    />
    <!-- Sets the theme class before first paint so a dark-mode visitor never sees a white flash. A blocking file, not
         an inline script, so the Content-Security-Policy (public/_headers) can stay script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Entry loader: static so it paints before the bundle runs; driven by src/features/intro/intro.ts -->
    <div id="intro" class="intro" role="status" aria-label="載入中">
      <canvas class="intro-sparks" aria-hidden="true"></canvas>
      <div class="intro-glow" aria-hidden="true"></div>
      <div class="intro-stage" aria-hidden="true">
        <div class="intro-mark">
          <span class="intro-mark-outline"></span>
          <span class="intro-mark-fill"></span>
          <span class="intro-mark-edge"></span>
        </div>
        <div class="intro-word">
          <span class="intro-word-base">susx.meiou</span>
          <span class="intro-word-fill">susx.meiou</span>
        </div>
        <p class="intro-count">
          Loading<span class="intro-count-rule"></span
          ><span class="intro-count-value">000</span>
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
