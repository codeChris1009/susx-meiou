<!doctype html>
<!-- zh-Hant-TW, not en: the browser picks glyphs for shared Han code points by `lang`, so this keeps them Traditional -->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f6f4ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12110f"
      media="(prefers-color-scheme: dark)"
    />
    <title>susx.meiou — 作品集</title>
    <meta
      name="description"
      content="susx 的線上作品：每一個都能直接打開來玩，部署在 Cloudflare Workers 與 GitHub Pages"
    />
    <!-- Sets the theme class before first paint so a dark-mode visitor never sees a white flash. A blocking file, not
         an inline script, so the Content-Security-Policy (public/_headers) can stay script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Entry loader: static so it paints before the bundle runs; driven by src/features/intro/intro.ts. It fills,
         waits for the visitor to press ENTER, then flies them through a ring of the works into the page -->
    <div id="intro" class="intro">
      <div class="intro-ring" aria-hidden="true">
        <div class="intro-ring-track"></div>
      </div>
      <canvas class="intro-sparks" aria-hidden="true"></canvas>
      <div class="intro-glow" aria-hidden="true"></div>
      <div class="intro-stage">
        <div class="intro-mark" aria-hidden="true">
          <span class="intro-mark-outline"></span>
          <span class="intro-mark-fill"></span>
          <span class="intro-mark-edge"></span>
        </div>
        <div class="intro-word" aria-hidden="true">
          <span class="intro-word-base">susx.meiou</span>
          <span class="intro-word-fill">susx.meiou</span>
        </div>
        <p class="intro-status sr-only" aria-live="polite">Loading</p>
        <div class="intro-gate">
          <p class="intro-count" aria-hidden="true">
            Loading<span class="intro-count-rule"></span
            ><span class="intro-count-value">000</span>
          </p>
          <button class="intro-enter" type="button">
            <span class="roll"
              ><span class="roll-in"
                >Enter<span class="roll-twin" aria-hidden="true"
                  >Enter</span
                ></span
              ></span
            >
          </button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
