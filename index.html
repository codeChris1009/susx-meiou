<!doctype html>
<!-- zh-Hant-TW, not en: the browser picks glyphs for shared Han code points by `lang`, so this keeps them Traditional -->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f6f4ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12110f"
      media="(prefers-color-scheme: dark)"
    />
    <title>susx.meiou — 作品集</title>
    <meta
      name="description"
      content="susx 的線上作品：每一個都能直接打開來玩，部署在 Cloudflare Workers 與 GitHub Pages"
    />
    <!-- Sets the theme class before first paint so a dark-mode visitor never sees a white flash. A blocking file, not
         an inline script, so the Content-Security-Policy (public/_headers) can stay script-src 'self'. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
